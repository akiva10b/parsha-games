<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lech Lecha: The Journey of Avraham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap">
<style>
  :root { --bg: #140e24; --fg: #f3ead6; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: "Fredoka", "Trebuchet MS", sans-serif; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game canvas { outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="loading">Loading the journey…</div>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="src/strings.js"></script>
<script src="audio/voice/manifest.js"></script>
<script src="src/save.js"></script>
<script src="src/audio.js"></script>
<script src="src/art.js"></script>
<script src="src/ui.js"></script>
<script src="src/platformer.js"></script>
<script src="src/scenes/boot.js"></script>
<script src="src/scenes/menu.js"></script>
<script src="src/scenes/story.js"></script>
<script src="src/scenes/overlays.js"></script>
<script src="src/scenes/journey.js"></script>
<script src="src/scenes/shepherds.js"></script>
<script src="src/scenes/rescue.js"></script>
<script src="src/scenes/stars.js"></script>
<script src="src/scenes/victory.js"></script>
<script src="src/main.js"></script>
</body>
</html>
